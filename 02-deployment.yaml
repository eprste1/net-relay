apiVersion: apps/v1
kind: Deployment
metadata:
  name: net-relay
  namespace: net-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: net-relay
  template:
    metadata:
      labels:
        app: net-relay
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.30.1-alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tls
              mountPath: /etc/nginx/certs
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
        - name: xray
          image: ghcr.io/xtls/xray-core:latest@sha256:592ec4d11f656db95598d01e76dbcc6e002d67360b96a5436500a938230f52c7
          command: ["xray", "run", "-c", "/etc/xray/config.json"]
          env:
            - name: GOMEMLIMIT
              value: "200MiB"
            - name: GOGC
              value: "50"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 220Mi
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: xray-config
              mountPath: /etc/xray
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: xray-config
          configMap:
            name: net-relay-config
        - name: tls
          secret:
            secretName: net-relay-tls
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
